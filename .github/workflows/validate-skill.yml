name: Validate Skills and Conventions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest pyyaml

      - name: Validate shared skill frontmatter and Codex metadata
        run: |
          python -c "
          import yaml
          from pathlib import Path

          skill_files = sorted(Path('skills').glob('*/SKILL.md'))
          assert skill_files, 'no shared skills found'
          for skill_file in skill_files:
              with open(skill_file) as f:
                  content = f.read()
              parts = content.split('---', 2)
              if len(parts) < 3:
                  raise ValueError(f'{skill_file} missing YAML frontmatter')
              meta = yaml.safe_load(parts[1])
              assert set(meta) == {'name', 'description'}, f'{skill_file} frontmatter fields: {set(meta)}'
              assert meta['name'] == skill_file.parent.name, f'{skill_file} name/folder mismatch'
              agent_meta = skill_file.parent / 'agents' / 'openai.yaml'
              assert agent_meta.exists(), f'{skill_file} missing agents/openai.yaml'
              yaml.safe_load(agent_meta.read_text())
              print(f'{skill_file} valid: {meta[\"description\"][:60]}...')
          "

      - name: Validate Claude and Codex plugin manifests
        run: |
          python -c "
          import json
          import re
          from pathlib import Path
          claude = json.loads(Path('.claude-plugin/plugin.json').read_text())
          codex = json.loads(Path('.codex-plugin/plugin.json').read_text())
          assert claude['name'] == codex['name'] == 'mycelium'
          codex_base, separator, cachebuster = codex['version'].partition('+')
          assert claude['version'] == codex_base
          if separator:
              assert re.fullmatch(r'codex\.[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*', cachebuster)
          assert claude['skills'] == codex['skills'] == './skills/'
          assert codex['interface']['displayName'] == 'Mycelium'
          "

      - name: Validate convention pack YAML files
        run: |
          python -c "
          import yaml
          from pathlib import Path

          required_fields = ['name', 'version', 'description', 'author', 'tags']
          conventions_dir = Path('network/conventions')

          for pack_dir in sorted(conventions_dir.iterdir()):
              if not pack_dir.is_dir():
                  continue
              yaml_path = pack_dir / 'CONVENTION_PACK.yaml'
              if not yaml_path.exists():
                  print(f'WARNING: {pack_dir.name}/ has no CONVENTION_PACK.yaml')
                  continue
              with open(yaml_path) as f:
                  content = f.read()
              # Handle YAML frontmatter format
              if content.startswith('---'):
                  parts = content.split('---', 2)
                  meta = yaml.safe_load(parts[1])
              else:
                  meta = yaml.safe_load(content)
              for field in required_fields:
                  assert field in meta, f'{pack_dir.name}/CONVENTION_PACK.yaml missing: {field}'
              print(f'{pack_dir.name} CONVENTION_PACK.yaml valid (v{meta[\"version\"]})')
          "

      - name: Test init and validate scripts
        run: |
          tmpdir=$(mktemp -d)
          python skills/core/scripts/init_repo.py --target-dir "$tmpdir"
          python skills/core/scripts/validate_structure.py --target-dir "$tmpdir"
          test -f "$tmpdir/MYCELIUM.md"
          test -f "$tmpdir/AGENTS.md"
          test ! -f "$tmpdir/.codex/hooks.json"
          test -f hooks/hooks.json
          test -x hooks/mycelium-codex-dispatch.sh

      - name: Run Python compatibility tests
        run: |
          pytest -q skills/core/scripts --ignore=skills/core/scripts/knowledge_map

      - name: Run hook compatibility tests
        run: |
          bash skills/core/hooks/test_stop_hook.sh
          bash skills/core/hooks/test_hooks_stress.sh
          bash skills/core/tests/test_integration_stress.sh

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !node_modules
        continue-on-error: true
